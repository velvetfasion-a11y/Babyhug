    <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile">

    <main class="product-page">
      <div class="container product-layout">
        <div class="product-gallery">
          <div class="product-thumbs" role="list" aria-label="Product images">
            <button type="button" class="product-thumb is-active" aria-label="View image 1">
              <img alt="" width="80" height="80" decoding="async" />
            </button>
            <button type="button" class="product-thumb" aria-label="View image 2">
              <img alt="" width="80" height="80" decoding="async" />
            </button>
          </div>
          <div class="product-main-image">
            <img id="product-main-img" alt="" width="900" height="1100" decoding="async" />
          </div>
        </div>

        <div class="product-details">
          <p id="product-sku" class="product-sku">SKU: 000000</p>
          <h1 id="product-title" class="product-detail-title">Product</h1>
          <p id="product-price" class="product-detail-price">$0.00</p>

          <div id="product-options" class="product-options" hidden></div>

          <div class="product-qty-block">
            <label for="product-qty">Quantity <span aria-hidden="true">*</span></label>
            <div class="product-qty-control">
              <button type="button" class="qty-minus" aria-label="Decrease quantity">−</button>
              <input id="product-qty" type="number" min="1" max="99" value="1" aria-required="true" />
              <button type="button" class="qty-plus" aria-label="Increase quantity">+</button>
            </div>
          </div>

          <button type="button" id="add-to-cart" class="btn btn-primary btn-add-cart">Add to Cart</button>

          <p id="product-description" class="product-detail-description"></p>

          <div class="product-accordions">
            <div class="product-accordion is-open">
              <button
                type="button"
                class="product-accordion-trigger"
                aria-expanded="true"
                aria-controls="accordion-info-body"
              >
                Product Info
                <span class="product-accordion-icon" aria-hidden="true"></span>
              </button>
              <div id="accordion-info-body" class="product-accordion-panel" role="region"></div>
            </div>

            <div class="product-accordion">
              <button
                type="button"
                class="product-accordion-trigger"
                aria-expanded="false"
                aria-controls="accordion-return-body"
              >
                Return &amp; Refund Policy
                <span class="product-accordion-icon" aria-hidden="true"></span>
              </button>
              <div id="accordion-return-body" class="product-accordion-panel" hidden></div>
            </div>

            <div class="product-accordion">
              <button
                type="button"
                class="product-accordion-trigger"
                aria-expanded="false"
                aria-controls="accordion-shipping-body"
              >
                Shipping Info
                <span class="product-accordion-icon" aria-hidden="true"></span>
              </button>
              <div id="accordion-shipping-body" class="product-accordion-panel" hidden></div>
            </div>
          </div>

    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        var pid = q.get("pid");
        var sku = q.get("sku");
        var id = q.get("id");
        if (!pid && !sku && !id) {
          location.replace("shop.html");
          return;
        }
        if (pid || sku) {
          var title = document.getElementById("product-title");
          var price = document.getElementById("product-price");
          if (title) title.textContent = "Loading…";
          if (price) price.textContent = "…";
        }
      })();
    </script>
    <script type="module" src="js/product.js"></script>
