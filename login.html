<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in | Baby Hug</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Epilogue:wght@400;500&family=Libre+Baskerville:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/login.css" />
    <!-- Import map: required for bare "firebase/..." imports in js/firebase-config.js -->
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://esm.sh/firebase@12.14.0/app",
          "firebase/auth": "https://esm.sh/firebase@12.14.0/auth",
          "firebase/firestore": "https://esm.sh/firebase@12.14.0/firestore",
          "firebase/storage": "https://esm.sh/firebase@12.14.0/storage",
          "firebase/analytics": "https://esm.sh/firebase@12.14.0/analytics"
        }
      }
    </script>
  </head>
  <body class="page-login">
    <header class="login-header">
      <a href="index.html" class="logo">Baby Hug</a>
    </header>

    <main class="login-main">
      <div class="login-card">
        <h1 id="login-heading">Welcome back</h1>
        <p id="login-lead" class="login-lead">Sign in to your account.</p>

        <div class="login-tabs" role="tablist" aria-label="Account mode">
          <button type="button" class="login-tab is-active" id="tab-sign-in">Sign in</button>
          <button type="button" class="login-tab" id="tab-register">Create account</button>
        </div>

        <form id="auth-form" novalidate>
          <div class="login-field">
            <label for="auth-email">Email</label>
            <input
              id="auth-email"
              name="email"
              type="email"
              autocomplete="email"
              required
              placeholder="you@example.com"
            />
          </div>
          <div class="login-field">
            <label for="auth-password">Password</label>
            <input
              id="auth-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              minlength="6"
              placeholder="At least 6 characters"
            />
          </div>
          <p id="auth-error" class="login-error" role="alert" aria-live="polite"></p>
          <button type="submit" class="login-btn" id="auth-submit">Sign in</button>
        </form>

        <div class="login-divider" aria-hidden="true">or</div>

        <button type="button" class="login-btn-google" id="google-login-btn" aria-label="Continue with Google">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.92a8.78 8.78 0 0 0 2.68-6.61z" />
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33A9 9 0 0 0 9 18z" />
            <path fill="#FBBC05" d="M3.97 10.71A5.41 5.41 0 0 1 3.68 9c0-.59.1-1.16.29-1.71V4.96H.96a9 9 0 0 0 0 8.04l3.01-2.33z" />
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z" />
          </svg>
          Continue with Google
        </button>

        <p id="auth-status" class="login-status" hidden>Signing you in…</p>

        <p class="login-footer">
          <a href="shop.html">← Back to shop</a>
        </p>
      </div>
    </main>

    <script type="module">
      import("./js/login.js?v=20260602e").catch((err) => {
        console.error(err);
        const box = document.getElementById("auth-error");
        if (box) {
          box.textContent =
            "Could not load Firebase (check that js/firebase-config.js exists on the server).";
        }
      });
    </script>
  </body>
</html>
