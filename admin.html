<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin — Baby Hug</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500&family=Libre+Baskerville:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body class="admin-body">
    <section id="admin-login" class="admin-login" aria-label="Sign in">
      <div class="admin-login-card">
        <h1>Baby Hug Admin</h1>
        <p>Sign in to edit product categories and prices.</p>
        <form id="login-form">
          <div class="admin-field">
            <label for="admin-user">Username</label>
            <input
              id="admin-user"
              name="username"
              type="text"
              autocomplete="username"
              required
            />
          </div>
          <div class="admin-field">
            <label for="admin-pass">Password</label>
            <input
              id="admin-pass"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <p id="login-error" class="admin-error" role="alert"></p>
          <button type="submit" class="admin-btn-primary">Sign in</button>
        </form>
      </div>
    </section>

    <div id="admin-app" class="admin-app" hidden>
      <header class="admin-topbar">
        <div>
          <div class="admin-topbar-title">Baby Hug — products</div>
          <div class="admin-topbar-meta" id="product-count">Loading…</div>
          <div class="admin-topbar-meta admin-storage-hint" id="admin-storage-hint" hidden></div>
        </div>
        <div class="admin-topbar-actions">
          <a class="admin-view-btn" href="/" target="_blank" rel="noopener">View storefront</a>
          <button type="button" class="admin-logout-btn" id="logout-btn">Sign out</button>
        </div>
      </header>

      <p id="admin-loading" class="admin-loading">Loading catalog…</p>
      <div class="admin-grid" id="admin-grid" hidden></div>
    </div>

    <script type="module" src="js/admin.js?v=4"></script>
  </body>
</html>
